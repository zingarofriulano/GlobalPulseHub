<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>GlobalPulse Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --surface: #11182a;
      --surface-2: #172137;
      --border: rgba(255,255,255,.09);
      --text: #eef2ff;
      --muted: #9aa8c2;
      --accent: #8b7bff;
      --accent-2: #41d9c3;
      --radius: 18px;
      --shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% -10%, rgba(108,91,255,.17), transparent 35%),
        radial-gradient(ellipse at 90% 15%, rgba(39,199,184,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    .container { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,16,32,.84);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }
    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex: 0 0 auto;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.5px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--accent), #4a9cff);
      box-shadow: 0 6px 22px rgba(111,95,255,.3);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand span:last-child em { color: var(--accent-2); font-style: normal; }

    .search-wrap { position: relative; flex: 1; max-width: 470px; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      transition: border-color .2s, background .2s;
    }
    .search-box:focus-within {
      border-color: rgba(139,123,255,.75);
      background: rgba(255,255,255,.07);
    }
    .search-box svg { width: 18px; color: var(--muted); flex: 0 0 auto; }
    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }
    .search-box input::placeholder { color: #7886a0; }

    .search-results {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      right: 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #121a2d;
      box-shadow: var(--shadow);
      display: none;
    }
    .search-results.open { display: block; animation: appear .16s ease-out; }
    .search-result {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px;
      text-align: left;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }
    .search-result:hover { background: rgba(255,255,255,.07); }
    .search-result-icon { font-size: 22px; }
    .search-result small { display: block; color: var(--muted); }

    .header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .region-select {
      max-width: 150px;
      padding: 9px 10px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: 0;
      background: var(--surface);
    }
    .region-select:focus { border-color: var(--accent); }

    .main-nav {
      border-top: 1px solid rgba(255,255,255,.04);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .main-nav::-webkit-scrollbar { display: none; }
    .nav-inner { display: flex; gap: 5px; min-height: 45px; align-items: center; }
    .nav-link {
      padding: 7px 11px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      transition: .2s;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); background: rgba(255,255,255,.08); }
    .nav-link.active { box-shadow: inset 0 -2px var(--accent-2); }

    main { min-height: 70vh; padding: 34px 0 70px; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 36px;
      align-items: center;
      padding: 46px;
      margin-bottom: 38px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 26px;
      background:
        radial-gradient(circle at 75% 30%, rgba(139,123,255,.25), transparent 30%),
        linear-gradient(120deg, #171c37, #111a2b 68%);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: 9%;
      bottom: -210px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(255,255,255,.025), 0 0 0 70px rgba(255,255,255,.02);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-2);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 13px var(--accent-2);
    }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 {
      max-width: 620px;
      margin: 14px 0 15px;
      font-size: clamp(32px, 5vw, 55px);
      line-height: 1.08;
      letter-spacing: -2px;
    }
    .hero h1 span {
      color: transparent;
      background: linear-gradient(90deg, #a69aff, #52dfcc);
      background-clip: text;
    }
    .hero p { max-width: 570px; margin-bottom: 22px; color: #aab6cb; font-size: 16px; }
    .hero-visual {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 190px;
      font-size: 92px;
      filter: drop-shadow(0 15px 25px rgba(108,91,255,.3));
      animation: float 5s ease-in-out infinite;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      cursor: pointer;
      transition: transform .18s, background .18s, border-color .18s;
    }
    .button:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.1); }
    .button-primary {
      border-color: transparent;
      color: #09111d;
      font-weight: 800;
      background: linear-gradient(100deg, #a99cff, #5fe0cf);
    }
    .button-primary:hover { background: linear-gradient(100deg, #b6aaff, #78ebdc); }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 35px 0 17px;
    }
    .section-heading h2 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .text-link { color: #a99cff; font-size: 13px; font-weight: 700; }
    .text-link:hover { color: #c1b8ff; }

    .category-grid, .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 15px;
    }
    .category-card, .catalog-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      transition: transform .2s, border-color .2s, background .2s;
    }
    .category-card:hover, .catalog-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139,123,255,.5);
      background: linear-gradient(145deg, rgba(139,123,255,.12), rgba(255,255,255,.025));
    }
    .category-card { padding: 19px; }
    .category-icon { font-size: 29px; }
    .category-card h3 { margin: 10px 0 3px; font-size: 16px; }
    .category-card p { margin: 0; color: var(--muted); font-size: 12px; }

    .catalog-card { overflow: hidden; }
    .cover {
      min-height: 145px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      font-size: 54px;
      background: linear-gradient(135deg, var(--cover-a, #473b95), var(--cover-b, #182d4e));
    }
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(7,11,23,.4), transparent 55%);
    }
    .cover > span { position: relative; z-index: 1; transition: transform .2s; }
    .catalog-card:hover .cover > span { transform: scale(1.12) rotate(-4deg); }
    .card-content { padding: 14px; }
    .card-content h3 { margin: 0 0 8px; font-size: 15px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-flex;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: #b7c2d7;
      background: rgba(255,255,255,.04);
      font-size: 10px;
    }

    .page-intro { margin: 10px 0 26px; }
    .page-intro h1 { margin: 8px 0; font-size: clamp(29px, 4vw, 42px); letter-spacing: -1.3px; }
    .page-intro p { margin: 0; color: var(--muted); }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .breadcrumbs a:hover { color: var(--text); }

    .detail-hero {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 25px;
      align-items: center;
      padding: 22px;
      margin-bottom: 27px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--surface);
    }
    .detail-cover {
      display: grid;
      place-items: center;
      min-height: 175px;
      border-radius: 15px;
      font-size: 64px;
      background: linear-gradient(135deg, var(--cover-a, #473b95), var(--cover-b, #182d4e));
    }
    .detail-hero h1 { margin: 9px 0; font-size: 34px; letter-spacing: -1px; }
    .detail-hero p { max-width: 670px; margin-bottom: 14px; color: var(--muted); }
    .detail-layout { display: grid; grid-template-columns: 1.35fr .65fr; gap: 18px; }
    .panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(17,24,42,.85);
    }
    .panel + .panel { margin-top: 16px; }
    .panel h2 { margin: 0 0 14px; font-size: 17px; }
    .news-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .news-item:first-of-type { border-top: 0; padding-top: 0; }
    .news-icon { font-size: 20px; }
    .news-item strong { display: block; font-size: 13px; }
    .news-item small { color: var(--muted); font-size: 11px; }
    .source-list { display: grid; gap: 9px; }
    .source-link {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #c8d2e7;
      background: rgba(255,255,255,.025);
      font-size: 12px;
    }
    .source-link:hover { color: var(--text); border-color: rgba(139,123,255,.45); }
    .source-link span:last-child { color: var(--accent-2); }

    .forum-tabs { display: flex; gap: 7px; margin-bottom: 15px; }
    .forum-tab {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .forum-tab.active { color: var(--text); border-color: rgba(139,123,255,.5); background: rgba(139,123,255,.13); }
    .post-list { display: grid; gap: 9px; }
    .post {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.025);
      overflow-wrap: anywhere;
    }
    .post-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
    .post-head strong { font-size: 12px; }
    .post-head small { color: var(--muted); font-size: 10px; }
    .post p { margin: 0; color: #c1cbe0; font-size: 13px; white-space: pre-wrap; }
    .empty-state { padding: 20px 10px; color: var(--muted); text-align: center; font-size: 13px; }
    .forum-form { display: grid; gap: 10px; margin-top: 15px; }
    .form-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .field {
      width: 100%;
      padding: 10px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      background: rgba(255,255,255,.04);
    }
    .field:focus { border-color: rgba(139,123,255,.75); }
    textarea.field { min-height: 85px; resize: vertical; }
    .form-hint { color: var(--muted); font-size: 11px; }

    .footer { padding: 22px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 15px; }

    @keyframes appear { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    @media (max-width: 850px) {
      .header-inner { flex-wrap: wrap; gap: 12px; padding: 12px 0; }
      .search-wrap { order: 3; flex-basis: 100%; max-width: none; }
      .header-actions { margin-left: auto; }
      .category-grid, .catalog-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .hero { padding: 32px; }
      .detail-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .container { width: min(100% - 26px, 1160px); }
      main { padding-top: 22px; }
      .hero { grid-template-columns: 1fr; gap: 4px; padding: 25px; }
      .hero h1 { letter-spacing: -1.4px; }
      .hero-visual { min-height: 95px; font-size: 60px; }
      .category-grid, .catalog-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .category-card { padding: 14px; }
      .cover { min-height: 115px; }
      .detail-hero { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      .detail-cover { min-height: 135px; }
      .detail-hero h1 { font-size: 28px; }
      .panel { padding: 15px; }
      .region-select { max-width: 125px; font-size: 12px; }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="GlobalPulse Hub, pagina iniziale">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 12h4l2.2-6 4.1 12 2.2-6H21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>GlobalPulse <em>Hub</em></span>
      </a>

      <div class="search-wrap">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="global-search" type="search" placeholder="Cerca giochi, libri, veicoli..." autocomplete="off" aria-label="Ricerca globale">
        </label>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>

      <div class="header-actions">
        <select id="region-select" class="region-select" aria-label="Seleziona area geografica">
          <option value="Italia">🇮🇹 Italia</option>
          <option value="Internazionale">🌐 Internazionale</option>
          <option value="Europa">🇪🇺 Europa</option>
        </select>
      </div>
    </div>

    <nav class="main-nav" aria-label="Navigazione principale">
      <div id="main-nav" class="container nav-inner"></div>
    </nav>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <footer class="footer">

      <span>© <span id="year"></span> GlobalPulse Hub · Il tuo mondo, in un unico posto.</span>

      { id: "cucina-vegetale", category: "cucina", title: "Cucina vegetale", icon: "🥑", tags: ["Vegetale", "Benessere"], description: "Ricette vegetali creative, gustose e facili da provare.", colors: ["#39835b", "#223e42"], links: [["Cucina Botanica", "https://www.cucinabotanica.com/"]], news: ["Nuove idee per portare più verdure nei piatti di tutti i giorni.", "Scambi di consigli su ingredienti e sostituzioni."] },
      { id: "stile-urbano", category: "moda", title: "Stile urbano", icon: "👟", tags: ["Streetwear", "Stile"], description: "Ispirazioni e idee per costruire un guardaroba urbano personale.", colors: ["#7d466f", "#343158"], links: [["Vogue Italia", "https://www.vogue.it/"]], news: ["Ispirazioni streetwear e abbinamenti della settimana.", "La community discute capi essenziali e brand emergenti."] },
      { id: "moda-sostenibile", category: "moda", title: "Moda sostenibile", icon: "♻️", tags: ["Sostenibilità", "Stile"], description: "Materiali, scelte consapevoli e idee per una moda più responsabile.", colors: ["#41765d", "#293851"], links: [["Fashion Revolution", "https://www.fashionrevolution.org/"]], news: ["Approfondimenti su materiali e filiere della moda.", "Consigli per prendersi cura dei capi e allungarne la vita."] },
      { id: "attualita", category: "politica", title: "Attualità italiana", icon: "🗞️", tags: ["Italia", "Attualità"], description: "Una sezione per seguire temi pubblici e confrontarsi con rispetto.", colors: ["#4c6597", "#252c4e"], links: [["ANSA", "https://www.ansa.it/"], ["Il Sole 24 Ore", "https://www.ilsole24ore.com/"]], news: ["Una rassegna dimostrativa dei temi di attualità.", "Consulta le fonti e verifica gli aggiornamenti direttamente sui siti ufficiali."] },
      { id: "istituzioni-europee", category: "politica", title: "Istituzioni europee", icon: "🇪🇺", tags: ["Europa", "Istituzioni"], description: "Notizie e risorse per orientarsi tra istituzioni e politiche europee.", colors: ["#4655a3", "#283553"], links: [["Unione europea", "https://european-union.europa.eu/"]], news: ["Risorse e aggiornamenti sulle istituzioni europee.", "Spazio di confronto informativo tra lettori."] },
      { id: "carriere-digitali", category: "lavoro", title: "Carriere digitali", icon: "💻", tags: ["Digitale", "Carriera"], description: "Competenze, percorsi professionali e risorse per il settore digitale.", colors: ["#27769b", "#253354"], links: [["LinkedIn", "https://www.linkedin.com/"], ["Indeed", "https://it.indeed.com/"]], news: ["Risorse dimostrative per orientarsi nel mercato digitale.", "Confronto tra percorsi, competenze e strumenti professionali."] },
      { id: "lavoro-italia", category: "lavoro", title: "Opportunità in Italia", icon: "📈", tags: ["Lavoro", "Italia"], description: "Consigli per ricerca, candidature e crescita professionale.", colors: ["#47715e", "#29394a"], links: [["Cliclavoro", "https://www.cliclavoro.gov.it/"]], news: ["Suggerimenti per preparare CV e colloqui.", "Condividi esperienze e risorse utili con la community."] }
    ];

    const app = document.getElementById("app");
    const nav = document.getElementById("main-nav");
    const searchInput = document.getElementById("global-search");
    const searchResults = document.getElementById("search-results");
    const regionSelect = document.getElementById("region-select");

    const categoryById = id => categories.find(category => category.id === id);
    const itemById = id => items.find(item => item.id === id);

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function getRoute() {
      const parts = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/").filter(Boolean);
      return { type: parts[0] || "home", id: parts[1] || "" };
    }

    function renderNav() {
      const route = getRoute();
      nav.innerHTML = `
        <a class="nav-link ${route.type === "home" ? "active" : ""}" href="#/">🏠 Home</a>
        ${categories.map(category => `
          <a class="nav-link ${route.type === "category" && route.id === category.id ? "active" : ""}"
             href="#/category/${category.id}">${category.icon} ${escapeHTML(category.name)}</a>
        `).join("")}
      `;
    }

    function itemCard(item) {
      return `
        <a class="catalog-card" href="#/item/${item.id}" style="--cover-a:${item.colors[0]};--cover-b:${item.colors[1]}">
          <div class="cover"><span>${item.icon}</span></div>
          <div class="card-content">
            <h3>${escapeHTML(item.title)}</h3>
            <div class="tag-row">${item.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          </div>
        </a>
      `;
    }

    function renderHome() {
      app.innerHTML = `
        <section class="hero">
          <div>
            <span class="eyebrow"><span class="pulse-dot"></span> Un hub, infinite passioni</span>
            <h1>Il mondo che ti interessa,<br><span>tutto in un unico posto.</span></h1>
            <p>Esplora community, notizie e risorse su giochi, libri, motori, cucina, moda, attualità e lavoro.</p>
            <a class="button button-primary" href="#/category/giochi">Esplora il portale <span aria-hidden="true">→</span></a>
          </div>
          <div class="hero-visual" aria-hidden="true">🌍</div>
        </section>

        <section>
          <div class="section-heading">
            <div><h2>Esplora le categorie</h2><p>Trova la tua prossima passione.</p></div>
          </div>
          <div class="category-grid">
            ${categories.map(category => `
              <a class="category-card" href="#/category/${category.id}">
                <span class="category-icon">${category.icon}</span>
                <h3>${escapeHTML(category.name)}</h3>
                <p>${escapeHTML(category.description)}</p>
              </a>
            `).join("")}
          </div>
        </section>

        <section>
          <div class="section-heading">
            <div><h2>In evidenza</h2><p>Una selezione di community da scoprire.</p></div>
            <a class="text-link" href="#/category/giochi">Vai ai giochi →</a>
          </div>
          <div class="catalog-grid">
            ${["elden-ring", "minecraft", "dune", "auto-elettriche"].map(id => itemCard(itemById(id))).join("")}
          </div>
        </section>
      `;
    }

    function renderCategory(id) {
      const category = categoryById(id);
      if (!category) return renderNotFound();
      const categoryItems = items.filter(item => item.category === id);

      app.innerHTML = `
        <div class="breadcrumbs"><a href="#/">Home</a> <span aria-hidden="true">/</span> ${escapeHTML(category.name)}</div>
        <section class="page-intro">
          <span class="eyebrow">${category.icon} Categoria</span>
          <h1>${escapeHTML(category.name)}</h1>
          <p>${escapeHTML(category.description)}. Scegli una sezione per vedere notizie, fonti e discussioni.</p>
        </section>
        <div class="catalog-grid">${categoryItems.map(itemCard).join("")}</div>
      `;
    }

    function renderDetail(id) {
      const item = itemById(id);
      if (!item) return renderNotFound();
      const category = categoryById(item.category);
      const region = regionSelect.value;
      const news = item.news.map((headline, index) => `
        <div class="news-item">
          <span class="news-icon">${index === 0 ? "📡" : "✨"}</span>
          <div><strong>${escapeHTML(headline)}</strong><small>${escapeHTML(region)} · Aggiornamento dimostrativo</small></div>
        </div>
      `).join("");

      app.innerHTML = `
        <div class="breadcrumbs"><a href="#/">Home</a> <span aria-hidden="true">/</span>
          <a href="#/category/${category.id}">${escapeHTML(category.name)}</a> <span aria-hidden="true">/</span> ${escapeHTML(item.title)}
        </div>
        <section class="detail-hero" style="--cover-a:${item.colors[0]};--cover-b:${item.colors[1]}">
          <div class="detail-cover">${item.icon}</div>
          <div>
            <span class="eyebrow">${category.icon} ${escapeHTML(category.name)}</span>
            <h1>${escapeHTML(item.title)}</h1>
            <p>${escapeHTML(item.description)}</p>
            <div class="tag-row">${item.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          </div>
        </section>

        <div class="detail-layout">
          <div>
            <section class="panel">
              <h2>📡 Notizie e aggiornamenti</h2>
              ${news}
            </section>
            <section class="panel">
              <h2>💬 Forum della community</h2>
              <div class="forum-tabs" role="tablist" aria-label="Sezioni forum">
                <button class="forum-tab active" type="button" data-forum-tab="community" role="tab" aria-selected="true">Community</button>
                <button class="forum-tab" type="button" data-forum-tab="info" role="tab" aria-selected="false">Info Generali</button>
              </div>
              <div id="post-list" class="post-list"></div>
              <form id="forum-form" class="forum-form">
                <input class="field" name="author" maxlength="30" placeholder="Il tuo nome (opzionale)" aria-label="Il tuo nome">
                <textarea class="field" name="message" maxlength="500" required placeholder="Condividi un pensiero con la community..." aria-label="Testo del post"></textarea>
                <div class="form-row">
                  <span class="form-hint">Massimo 500 caratteri. I post restano salvati in questo browser.</span>
                  <button class="button button-primary" type="submit">Pubblica</button>
                </div>
              </form>
            </section>
          </div>
          <aside>
            <section class="panel">
              <h2>🔗 Collegamenti utili</h2>
              <div class="source-list">
                ${item.links.map(([label, url]) => `
                  <a class="source-link" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">
                    <span>${escapeHTML(label)}</span><span aria-hidden="true">↗</span>
                  </a>
                `).join("")}
              </div>
            </section>
            <section class="panel">
              <h2>ℹ️ Informazioni</h2>
              <p style="margin:0;color:var(--muted);font-size:13px">
                I contenuti di notizie sono simulati in questa versione iniziale.
                Selezione attuale: <strong>${escapeHTML(region)}</strong>.
              </p>
            </section>
          </aside>
        </div>
      `;

      setupForum(item.id);
    }

    function renderNotFound() {
      app.innerHTML = `
        <section class="panel" style="text-align:center;padding:50px 20px">
          <div style="font-size:44px">🧭</div>
          <h1>Contenuto non trovato</h1>
          <p style="color:var(--muted)">La pagina richiesta non è disponibile.</p>
          <a class="button button-primary" href="#/">Torna alla home</a>
        </section>
      `;
    }

    function render() {
      renderNav();
      const route = getRoute();
      if (route.type === "home") renderHome();
      else if (route.type === "category") renderCategory(route.id);
      else if (route.type === "item") renderDetail(route.id);
      else renderNotFound();
      searchResults.classList.remove("open");
      searchInput.setAttribute("aria-expanded", "false");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function storageKey(itemId) { return `globalpulse-forum-${itemId}`; }

    function getPosts(itemId) {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey(itemId)) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function setupForum(itemId) {
      let activeTab = "community";
      const postList = document.getElementById("post-list");
      const form = document.getElementById("forum-form");
      const tabs = [...document.querySelectorAll("[data-forum-tab]")];

      function drawPosts() {
        const posts = getPosts(itemId).filter(post => post.section === activeTab);
        postList.innerHTML = posts.length ? posts.map(post => `
          <article class="post">
            <div class="post-head">
              <strong>${escapeHTML(post.author || "Utente")}</strong>
              <small>${escapeHTML(post.date || "")}</small>
            </div>
            <p>${escapeHTML(post.message)}</p>
          </article>
        `).join("") : `<div class="empty-state">Ancora nessun post in questa sezione. Inizia tu la conversazione!</div>`;
      }

      tabs.forEach(tab => tab.addEventListener("click", () => {
        activeTab = tab.dataset.forumTab;
        tabs.forEach(button => {
          const selected = button === tab;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-selected", String(selected));
        });
        drawPosts();
      }));

      form.addEventListener("submit", event => {
        event.preventDefault();
        const formData = new FormData(form);
        const message = String(formData.get("message") || "").trim();
        if (!message) return;

        const posts = getPosts(itemId);
        posts.unshift({
          author: String(formData.get("author") || "").trim().slice(0, 30) || "Utente",
          message: message.slice(0, 500),
          section: activeTab,
          date: new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date())
        });

        try {
          localStorage.setItem(storageKey(itemId), JSON.stringify(posts));
          form.reset();
          drawPosts();
        } catch {
          alert("Non è stato possibile salvare il post nel browser.");
        }
      });

      drawPosts();
    }

    function findMatches(query) {
      const normalized = query.trim().toLocaleLowerCase("it");
      if (!normalized) return [];
      return items.filter(item => {
        const category = categoryById(item.category);
        const searchable = [item.title, item.description, ...item.tags, category?.name].join(" ").toLocaleLowerCase("it");
        return searchable.includes(normalized);
      }).slice(0, 7);
    }

    function showSearchResults(query) {
      const matches = findMatches(query);
      if (!query.trim()) {
        searchResults.classList.remove("open");
        searchInput.setAttribute("aria-expanded", "false");
        return;
      }

      searchResults.innerHTML = matches.length
        ? matches.map(item => {
            const category = categoryById(item.category);
            return `
              <a class="search-result" role="option" href="#/item/${item.id}">
                <span class="search-result-icon">${item.icon}</span>
                <span><strong>${escapeHTML(item.title)}</strong><small>${escapeHTML(category.name)} · ${item.tags.map(escapeHTML).join(", ")}</small></span>
              </a>
            `;
          }).join("")
        : `<div class="empty-state">Nessun risultato. Prova con un’altra parola.</div>`;

      searchResults.classList.add("open");
      searchInput.setAttribute("aria-expanded", "true");
    }

    searchInput.addEventListener("input", event => showSearchResults(event.target.value));
    searchInput.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        searchResults.classList.remove("open");
        searchInput.setAttribute("aria-expanded", "false");
      }
      if (event.key === "Enter") {
        const firstResult = searchResults.querySelector("a");
        if (firstResult) location.hash = firstResult.getAttribute("href");
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-wrap")) {
        searchResults.classList.remove("open");
        searchInput.setAttribute("aria-expanded", "false");
      }
    });

    regionSelect.addEventListener("change", () => {
      const route = getRoute();
      if (route.type === "item") renderDetail(route.id);
    });

    window.addEventListener("hashchange", render);
    document.getElementById("year").textContent = new Date().getFullYear();

    render();
  </script>
</body>
</html>
